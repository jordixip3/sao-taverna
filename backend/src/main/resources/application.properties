# SAÓ Taverna - Backend Configuration
server.port=8080

# Database (overridden by Docker env vars)
spring.datasource.url=jdbc:mysql://mysql:3306/sao_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=sao_user
spring.datasource.password=sao_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
