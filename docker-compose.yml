

services:
  mysql:
    image: mysql:8.0
    container_name: sao_mysql
    environment:
      MYSQL_DATABASE: sao_db
      MYSQL_USER: sao_user
      MYSQL_PASSWORD: sao_pass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - sao_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/sao_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=sao_user
      - SPRING_DATASOURCE_PASSWORD=sao_pass
    ports:
      - "8124:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8182:80"
    depends_on:
      - backend

volumes:
  sao_mysql_data:
